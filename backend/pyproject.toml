[project]
name = "mianshi-backend"
version = "0.1.0"
description = "求职操作系统（mianshi）后端：面试模拟、评分与薄弱点训练、投递分析"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    # M1 实时语音：作为客户端连接上游实时语音 WS
    "websockets>=13",
    # 简历文件上传：PDF 与 Word 文本提取
    "pypdf>=6",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
